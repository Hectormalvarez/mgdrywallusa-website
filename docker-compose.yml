name: mgdrywall-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mgdrywall}
      POSTGRES_USER: ${DB_USER:-mgdrywall}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mgdrywall", "-d", "mgdrywall"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8101}
      DB_NAME: ${DB_NAME:-mgdrywall}
      DB_USER: ${DB_USER:-mgdrywall}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8101}
      WAGTAIL_PREVIEW_URL: ${WAGTAIL_PREVIEW_URL:-}
      WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL:-http://localhost:8101}
      # Cloudflare purge credentials for wagtail.contrib.frontend_cache (US-008).
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./backend:/app
      - media_data:/app/media

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_LEAD_API_URL: ${NEXT_PUBLIC_LEAD_API_URL:-/api/v1/leads/}
      NEXT_PUBLIC_WAGTAIL_API_URL: ${NEXT_PUBLIC_WAGTAIL_API_URL:-/api/v1/pages/?type=portfolio.PortfolioItem&fields=*}
      WAGTAIL_API_BASE_URL: ${WAGTAIL_API_BASE_URL:-http://backend:8000/api/v1}
      # Public origin for canonical metadata/SEO (e.g. robots, sitemap, JSON-LD).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Hostnames the Next.js dev server accepts cross-origin /_next/* requests
      # from. Without the public tunnel hostname here, `next dev` answers 403
      # for JS chunks and the HMR websocket, and the site fails to hydrate.
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
      # Origin used by the Wagtail preview redirect route.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8101}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    build: ./nginx
    ports:
      - "${NGINX_HOST_PORT:-8101}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Containerized Cloudflare Tunnel for the DEV stack.
  #
  # Opt-in only: this service is behind the "tunnel" profile, so `make dev-up`
  # does NOT start it. Bring it up with `make dev-tunnel-up`.
  #
  # It belongs to the mgdrywall-dev compose project, so it is completely
  # independent of the production connector in docker-compose.prod.yml — you
  # never have to run the prod stack to get a dev tunnel.
  #
  # In the Cloudflare dashboard the tunnel's public hostname must point at the
  # Nginx service by name inside this network:  http://nginx:80
  #
  # TUNNEL_TOKEN is intentionally defaulted to empty (not `${VAR:?}`): Docker
  # Compose interpolates every service in the file even when its profile is
  # disabled, so a required-variable guard here would break `make dev-up`.
  # The empty-token check lives in the `dev-tunnel-up` Make target instead.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    cap_drop:
      - ALL

volumes:
  pgdata:
  media_data:

