name: mgdrywall-prod
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-mgdrywall}", "-d", "${POSTGRES_DB:-mgdrywall}"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/${REGISTRY_OWNER:-mgdrywall}/mgdrywall-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        # X-Forwarded-Proto is required: without it Django's
        # SECURE_SSL_REDIRECT 301s the plain-HTTP container request, and
        # urllib's redirect to https://127.0.0.1:8000 hangs until timeout
        # (gunicorn does not serve TLS). Same pattern as the frontend's
        # INTERNAL_FETCH_HEADERS.
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/pages/', headers={'X-Forwarded-Proto': 'https'}))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - media_data:/app/media
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/${REGISTRY_OWNER:-mgdrywall}/mgdrywall-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ghcr.io/${REGISTRY_OWNER:-mgdrywall}/mgdrywall-nginx:${IMAGE_TAG:-latest}
    build: ./nginx
    restart: unless-stopped
    # Publish the gateway on loopback only. Local tooling (make prod-verify)
    # and the host Cloudflare Tunnel reach the stack via http://127.0.0.1:9417.
    ports:
      - "127.0.0.1:9417:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  webhook:
    build: ./webhook
    command: -verbose -hooks=/etc/webhook/hooks.json -hotreload
    restart: unless-stopped
    env_file: .env.prod
    environment:
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?WEBHOOK_TOKEN is required}
    volumes:
      # The host repo is mounted at /opt/mgdrywallusa-website inside the
      # webhook container. This is an IN-CONTAINER path only — the host
      # repo lives at /home/hadev/Projects/Code/mgdrywallusa-website.
      # The identical-absolute-path mount is required so that when docker
      # compose runs inside this container (via the mounted Docker socket),
      # relative bind-mount sources in docker-compose.prod.yml resolve to
      # the same absolute paths on the host filesystem.
      - .:/opt/mgdrywallusa-website
      - /var/run/docker.sock:/var/run/docker.sock
      - ./webhook/hooks.json:/etc/webhook/hooks.json.template:ro
    depends_on:
      - nginx
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  media_data:
