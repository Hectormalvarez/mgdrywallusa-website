[pytest]
DJANGO_SETTINGS_MODULE = core.settings_test
pythonpath = .
testpaths = portfolio core leads
python_files = test_*.py tests.py
addopts = --reuse-db -v
filterwarnings =
    # Wagtail 6.x does not yet pass assume_scheme to forms.URLField; suppress
    # the Django 6.0 deprecation warning that originates inside Wagtail internals.
    ignore::django.utils.deprecation.RemovedInDjango60Warning
    # Wagtail image rendition internals leave a tempfile open; not our code.
    ignore::ResourceWarning
